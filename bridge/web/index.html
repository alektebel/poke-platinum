<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jev ▸ platinum · live</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #11151f; --panel2: #161b28; --line: #232a3a;
    --txt: #d7dce6; --dim: #7d8593; --acc: #58c4dd; --acc2: #b18cf0;
    --ok: #3fd08c; --warn: #e6b450; --bad: #ef6b73;
    --mono: "JetBrains Mono", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--txt); font-family: var(--mono);
    font-size: 13px; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 14px; letter-spacing: 1px; color: var(--acc); font-weight: 600; }
  header h1 span { color: var(--dim); font-weight: 400; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  #status { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  .stat { color: var(--dim); }
  .stat b { color: var(--txt); font-weight: 500; }
  .turbo-on { color: var(--warn); font-weight: 600; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 400px; min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .col.left { border-right: 1px solid var(--line); }

  .panel { display: flex; flex-direction: column; min-height: 0; }
  .panel + .panel { border-top: 1px solid var(--line); }
  .panel h2 {
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--dim); padding: 8px 14px; background: var(--panel);
    border-bottom: 1px solid var(--line); display: flex; justify-content: space-between;
  }
  .panel h2 .tag { color: var(--acc); }
  .body { overflow-y: auto; padding: 12px 14px; }

  /* screens + game state */
  #screens { display: flex; justify-content: center; background: #05070b; padding: 10px; }
  #screenimg { height: 62vh; max-height: 560px; image-rendering: pixelated;
               border: 1px solid var(--line); border-radius: 4px; }
  #gamestate { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 10px; font-size: 12px;
  }
  .chip .k { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; display: block; }
  .chip .v { color: var(--acc); font-size: 14px; }
  #dialogbox {
    margin-top: 10px; background: #f4f4ec; color: #20242c; border-radius: 4px;
    padding: 10px 12px; font-size: 13px; min-height: 40px; white-space: pre-wrap;
  }
  #dialogbox.empty { background: var(--panel2); color: var(--dim); font-style: italic; }

  /* goal (system 2) */
  .goal-main {
    background: linear-gradient(135deg, #1a1530, #141824);
    border: 1px solid #3d2f66; border-radius: 6px; padding: 14px;
  }
  .goal-main .who { color: var(--acc2); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
  .goal-main .text { font-size: 15px; line-height: 1.5; margin-top: 8px; color: #efe9ff; }
  .goal-main .note { margin-top: 8px; color: var(--dim); font-size: 11px; }
  .goal-none { color: var(--dim); font-style: italic; }
  .goal-hist { margin-top: 12px; }
  .goal-hist .gh {
    padding: 7px 10px; border-left: 2px solid #3d2f66; margin-bottom: 6px;
    color: var(--dim); font-size: 12px; background: var(--panel2); border-radius: 0 4px 4px 0;
  }
  .goal-hist .gh b { color: var(--acc2); font-weight: 500; }

  /* system 1 */
  .s1card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  .s1card .name { color: var(--acc); font-size: 15px; font-weight: 600; }
  .s1card .idle { color: var(--dim); font-style: italic; }
  .s1row { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; }
  .s1row .k { color: var(--dim); }
  .bar { height: 8px; background: #0a0d13; border: 1px solid var(--line); border-radius: 4px; margin-top: 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--acc); transition: width .4s; }
  .phase { display: inline-block; background: #0a0d13; border: 1px solid var(--line);
           border-radius: 3px; padding: 1px 7px; color: var(--warn); text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }

  /* logs */
  .entry { border-bottom: 1px solid var(--line); padding: 8px 2px; }
  .entry:last-child { border-bottom: none; }
  .ehead { display: flex; align-items: baseline; gap: 8px; }
  .etime { color: var(--dim); font-size: 10px; flex-shrink: 0; }
  .ebadge {
    font-size: 10px; padding: 1px 7px; border-radius: 3px; letter-spacing: .5px;
    background: #0a0d13; border: 1px solid var(--line); color: var(--acc); flex-shrink: 0;
  }
  .ebadge.goal { color: var(--acc2); border-color: #3d2f66; }
  .ebadge.sys  { color: var(--warn); }
  .ebadge.bad  { color: var(--bad); }
  .ebadge.ok   { color: var(--ok); }
  .esum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details { margin-top: 4px; }
  summary { cursor: pointer; color: var(--acc); font-size: 11px; user-select: none; width: fit-content; }
  summary:hover { text-decoration: underline; }
  details pre {
    margin-top: 6px; background: #05070b; border: 1px solid var(--line); border-radius: 4px;
    padding: 8px; font-size: 11px; line-height: 1.45; overflow-x: auto; color: #a8b3c5;
  }
  .empty-note { color: var(--dim); font-style: italic; padding: 6px 2px; }
</style>
</head>
<body>
<header>
  <h1>jev ▸ platinum <span>live dashboard</span></h1>
  <div id="status"><span class="dot" id="dot"></span><span id="conntxt">connecting…</span></div>
  <div class="stat">fps <b id="fps">–</b></div>
  <div class="stat">frame <b id="frame">–</b></div>
  <div class="stat" id="turbo"></div>
  <div class="stat" id="exp"></div>
</header>

<main>
  <div class="col left">
    <div class="panel" style="flex:0 0 auto;">
      <div id="screens"><img id="screenimg" alt="DS screens"></div>
    </div>
    <div class="panel" style="flex:0 0 auto;">
      <h2>game state <span class="tag" id="scene">–</span></h2>
      <div class="body">
        <div id="gamestate"></div>
        <div id="dialogbox" class="empty">no dialog</div>
      </div>
    </div>
    <div class="panel" style="flex:1;">
      <h2>event stream</h2>
      <div class="body" id="events"><div class="empty-note">waiting…</div></div>
    </div>
  </div>

  <div class="col right">
    <div class="panel" style="flex:0 0 auto;">
      <h2>system 2 · main goal</h2>
      <div class="body">
        <div id="goalmain" class="goal-none">no goal declared yet — System 2 silent</div>
        <div class="goal-hist" id="goalhist"></div>
      </div>
    </div>
    <div class="panel" style="flex:0 0 auto;">
      <h2>system 1 · controller</h2>
      <div class="body" id="s1body"></div>
    </div>
    <div class="panel" style="flex:1;">
      <h2>actions by jev</h2>
      <div class="body" id="actions"><div class="empty-note">no commands yet</div></div>
    </div>
  </div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
let lastEventSeq = -1, lastActionSeq = -1, seenEvents = new Set(), seenActions = new Set();

function now() { return new Date().toLocaleTimeString([], {hour12: false}); }
async function jget(url) {
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error(url + " -> " + r.status);
  return r.json();
}
function conn(ok) {
  $("dot").className = "dot" + (ok ? " on" : "");
  $("conntxt").textContent = ok ? "live" : "offline";
}
function pretty(o) { return JSON.stringify(o, null, 1); }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

/* ---------- header + game state ---------- */
async function pollState() {
  try {
    const s = await jget("/state");
    conn(true);
    $("fps").textContent = s.fps ?? "–";
    $("frame").textContent = (s.frame ?? 0).toLocaleString();
    $("turbo").innerHTML = s.turbo ? '<span class="turbo-on">⏩ TURBO</span>' : "";
    $("scene").textContent = s.game ? "field" : (s.note ? "non-field" : "–");

    const chips = [];
    if (s.game && s.game.map) {
      chips.push(["map", s.game.map.id], ["pos", `${s.game.map.x},${s.game.map.z}`], ["facing", s.game.map.facing]);
    } else if (s.game && s.game.player) {
      chips.push(["pos", `${s.game.player.x},${s.game.player.z}`]);
    }
    chips.push(["objects", s.game?.objects?.count ?? "–"]);
    chips.push(["controller", s.controller ?? "none"]);
    const scr = s.screen || {};
    chips.push(["dialog box", scr.message_box ? "open" : "closed"]);
    if (scr.battle) chips.push(["battle", "ACTIVE"]);
    if (scr.yes_no) chips.push(["choice", "yes/no"]);
    $("gamestate").innerHTML = chips.map(([k, v]) =>
      `<div class="chip"><span class="k">${k}</span><span class="v">${esc(String(v))}</span></div>`).join("");

    const dlg = s.game?.dialog;
    const db = $("dialogbox");
    if (dlg) { db.textContent = dlg; db.className = ""; }
    else { db.textContent = "no dialog"; db.className = "empty"; }
  } catch (e) { conn(false); }
}

/* ---------- screen ---------- */
let screenBusy = false;
function pollScreen() {
  if (screenBusy) return;
  screenBusy = true;
  const img = new Image();
  img.onload = img.onerror = () => {
    if (img.width) $("screenimg").src = img.src;
    screenBusy = false;
  };
  img.src = "/screen?part=both&t=" + Date.now();
  setTimeout(() => { screenBusy = false; }, 3000);
}

/* ---------- events ---------- */
const EV_COLORS = {map_changed: "goal", battle_started: "bad", battle_ended: "ok",
                   wall_learned: "sys", warp_learned: "goal", note: "sys"};
async function pollEvents() {
  try {
    const d = await jget("/events?since=" + Math.max(lastEventSeq, 0));
    const list = $("events");
    const fresh = d.events.filter(e => !seenEvents.has(e.seq));
    if (fresh.length && lastEventSeq >= 0 && list.querySelector(".empty-note")) list.innerHTML = "";
    for (const e of fresh.reverse()) {
      seenEvents.add(e.seq);
      lastEventSeq = Math.max(lastEventSeq, e.seq);
      const div = document.createElement("div");
      div.className = "entry";
      const extra = Object.entries(e).filter(([k]) => !["seq", "t", "kind"].includes(k))
        .map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join("  ");
      div.innerHTML = `<div class="ehead"><span class="etime">${now()}</span>` +
        `<span class="ebadge ${EV_COLORS[e.kind] || ""}">${esc(e.kind)}</span>` +
        `<span class="esum">${esc(extra)}</span></div>` +
        (extra ? `<details><summary>see more</summary><pre>${esc(pretty(e))}</pre></details>` : "");
      list.prepend(div);
    }
    while (list.children.length > 200) list.lastChild.remove();
  } catch (e) { /* offline: header dot handles it */ }
}

/* ---------- system 2 goal ---------- */
function renderGoal(t) {
  const g = t.main_goal;
  const main = $("goalmain");
  if (g) {
    main.className = "goal-main";
    main.innerHTML = `<div class="who">declared by system 2</div>` +
      `<div class="text">“${esc(g.text)}”</div>` +
      (g.note ? `<div class="note">${esc(g.note)}</div>` : "");
  } else {
    main.className = "goal-none";
    main.textContent = "no goal declared yet — System 2 silent";
  }
  $("goalhist").innerHTML = (t.goals || [])
    .filter(g => g.seq !== (t.main_goal && t.main_goal.seq))
    .slice(0, 10)
    .map(g => {
      const lvl = g.main ? "MAIN" : (String(g.note || "").startsWith("phase") ? "PHASE" : "sub");
      return `<div class="gh"><b>${lvl}</b> ${esc(g.text)}</div>`;
    }).join("");
}

/* ---------- system 1 controller ---------- */
function renderS1(t) {
  const c = t.system1?.controller;
  const b = $("s1body");
  if (!c) {
    b.innerHTML = `<div class="s1card"><span class="idle">idle — no active System 1 goal</span></div>`;
    return;
  }
  const rows = [];
  if (c.target) rows.push(["target", Array.isArray(c.target) ? `(${c.target[0]}, ${c.target[1]})` : esc(String(c.target))]);
  if (c.phase) rows.push(["phase", `<span class="phase">${esc(String(c.phase))}</span>`]);
  if (c.hold_dir) rows.push(["holding", esc(String(c.hold_dir))]);
  if (c.dir) rows.push(["menu dir", esc(String(c.dir))]);
  if (c.move_index !== undefined) rows.push(["move", "#" + c.move_index]);
  if (c.fail !== undefined) rows.push(["bump fails", String(c.fail)]);
  if (c.taps !== undefined) rows.push(["taps", String(c.taps)]);
  rows.push(["ticks", String(c.ticks ?? 0)]);
  b.innerHTML = `<div class="s1card"><span class="name">${esc(c.name)}</span>` +
    rows.map(([k, v]) => `<div class="s1row"><span class="k">${k}</span><span>${v}</span></div>`).join("") +
    `<div class="bar"><i style="width:${Math.round((c.progress || 0) * 100)}%"></i></div>` +
    `</div>`;
}

/* ---------- actions by jev ---------- */
function summarize(a) {
  const i = a.input || {};
  switch (a.action) {
    case "walk_to": return `walk to (${i.x}, ${i.z ?? i.y})`;
    case "tap": return `tap ${i.key} ×${i.frames || 2}f`;
    case "press": return `press ${(i.keys || []).join("+")}`;
    case "hold": return `hold ${i.key}`;
    case "release": return `release ${i.key}`;
    case "touch": return `touch (${i.x}, ${i.y})`;
    case "wait": return `wait ${i.frames || 1}f`;
    case "menu_navigate": return `menu ${i.dir} ×${i.count || 1}${i.confirm ? " +A" : ""}`;
    case "battle_fight": return `battle: fight move #${i.index || 0}`;
    case "advance_dialog": return `advance dialog (≤${i.max_taps || 60} taps)`;
    case "savestate": return `savestate → ${i.file}`;
    case "loadstate": return `loadstate ← ${i.file}`;
    case "note": return `📝 ${i.text || ""}`;
    case "debug_read": return `read ${i.addr} (+${i.len || 16})`;
    case "_controller_done": return `✔ System 1 finished: ${i.controller}`;
    default: return a.action || "?";
  }
}
async function pollTelemetry() {
  try {
    const t = await jget("/telemetry");
    const ex = t.experiment;
    $("exp").innerHTML = ex && ex.recording
      ? `<span style="color:var(--bad)">● REC</span> ${Math.round(ex.elapsed_s / 60)}m` : "";
    renderGoal(t);
    renderS1(t);
    const list = $("actions");
    const fresh = (t.actions || []).filter(a => !seenActions.has(a.seq));
    if (fresh.length && lastActionSeq >= 0 && list.querySelector(".empty-note")) list.innerHTML = "";
    for (const a of fresh) {
      seenActions.add(a.seq);
      lastActionSeq = Math.max(lastActionSeq, a.seq);
      const ok = a.result?.ok;
      const isSys = a.action === "_controller_done";
      const badge = a.result && ok === false ? "bad" : isSys ? "sys" : "ok";
      const res = a.result ? pretty(a.result) : "(no result)";
      const div = document.createElement("div");
      div.className = "entry";
      div.innerHTML = `<div class="ehead"><span class="etime">${now()}</span>` +
        `<span class="ebadge ${badge}">${esc(String(a.action))}</span>` +
        `<span class="esum">${esc(summarize(a))}</span></div>` +
        `<details><summary>see more</summary><pre>input:\n${esc(pretty(a.input))}\n\nresult:\n${esc(res)}</pre></details>`;
      list.prepend(div);
    }
    while (list.children.length > 150) list.lastChild.remove();
  } catch (e) { /* offline handled elsewhere */ }
}

/* ---------- loop ---------- */
async function tick() {
  await Promise.allSettled([pollState(), pollEvents(), pollTelemetry()]);
}
setInterval(tick, 800);
setInterval(pollScreen, 900);
tick();
pollScreen();
</script>
</body>
</html>
